<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vorbestellen – Gemüsekiste</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .order-wrap { max-width: 800px; margin: 0 auto; padding: 24px; }
    .greeting { font-size: 1rem; color: var(--color-text-light); margin-bottom: 20px; }

    /* Week tabs */
    .week-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .week-tab {
      padding: 10px 18px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      background: #fff;
      transition: all 0.12s;
    }
    .week-tab:hover { border-color: var(--color-green); }
    .week-tab.active {
      background: var(--color-green);
      background-image: linear-gradient(to bottom, rgba(255,255,255,.2), rgba(255,255,255,.01));
      color: #fff;
      border-color: var(--color-green);
      font-weight: 600;
    }
    .week-tab .order-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      margin-left: 6px;
      opacity: 0;
    }
    .week-tab.has-order .order-dot { opacity: 0.85; }
    .week-tab.active.has-order .order-dot { background: rgba(255,255,255,0.9); }
    .week-tab.has-order:not(.active) .order-dot { background: var(--color-green); }

    /* Veg selection grid */
    .veg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .veg-card {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }
    .veg-card.selected {
      border-color: var(--color-green);
      box-shadow: 0 0 0 2px rgba(106, 177, 101, 0.2);
    }
    .veg-card .veg-name { font-weight: 600; margin-bottom: 4px; }
    .veg-card .veg-price { font-size: 0.8rem; color: var(--color-text-light); margin-bottom: 12px; }
    .qty-control { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .qty-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
    }
    .qty-btn:hover { background: var(--color-bg); border-color: var(--color-green); }
    .qty-value { min-width: 28px; text-align: center; font-weight: 700; font-size: 1.1rem; }

    /* Order bar */
    .order-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 16px;
    }
    .order-total { font-size: 1.15rem; font-weight: 700; }
    .order-total span { color: var(--color-text-light); font-weight: 400; font-size: 0.9rem; }
    .btn-order {
      background: var(--color-green);
      background-image: linear-gradient(to bottom, rgba(255,255,255,.2), rgba(255,255,255,.01));
      border: none;
      color: #fff;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }
    .btn-order:hover { background: var(--color-green-dark); }
    .btn-order:disabled { background: #ccc; cursor: not-allowed; }

    .success-msg {
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      border-radius: 8px;
      color: #2e7d32;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: none;
    }
    .success-msg.show { display: block; }

    .empty-state { text-align: center; color: var(--color-text-light); padding: 40px; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>🥕 Meine Bestellung</h1>
    <div style="display:flex;gap:16px;align-items:center">
      <a class="admin-link" href="index.html">Startseite</a>
      <a class="admin-link" id="logoutLink" href="#">Abmelden</a>
    </div>
  </header>

  <div class="order-wrap">
    <p class="greeting" id="greeting"></p>

    <div class="week-tabs" id="weekTabs"></div>

    <div class="success-msg" id="successMsg">✓ Bestellung gespeichert!</div>

    <div class="order-bar">
      <div class="order-total" id="orderTotal">0,00 € <span>für diese Woche</span></div>
      <button class="btn-order" id="orderBtn">Bestellen</button>
    </div>

    <div class="veg-grid" id="vegGrid">
      <div class="empty-state">Kein Gemüse verfügbar.</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="users.js"></script>
  <script src="orders.js"></script>
  <script>
    const session = getUserSession();
    if (!session) location.href = 'login.html';

    document.getElementById('greeting').textContent = `Hallo, ${session.username}!`;
    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      clearUserSession();
      location.href = 'login.html';
    });

    const weeks = getNextThreeWeeks();
    let activeWeekIdx = 0;
    // qty[weekKey][vegId] = quantity
    const qty = {};

    function formatPrice(value) {
      return value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    }

    function getVegetables() {
      return loadVegetables().filter(v => v.active);
    }

    // Load saved orders from localStorage into qty
    function loadSavedOrders() {
      for (const week of weeks) {
        qty[week.key] = {};
        const saved = getOrdersForUserWeek(session.id, week.key);
        for (const o of saved) qty[week.key][o.vegId] = o.quantity;
      }
    }

    function hasOrderForWeek(weekKey) {
      const q = qty[weekKey] || {};
      return Object.values(q).some(v => v > 0);
    }

    function renderWeekTabs() {
      const tabsEl = document.getElementById('weekTabs');
      tabsEl.innerHTML = '';
      for (let i = 0; i < weeks.length; i++) {
        const w = weeks[i];
        const tab = document.createElement('button');
        tab.className = 'week-tab' + (i === activeWeekIdx ? ' active' : '') + (hasOrderForWeek(w.key) ? ' has-order' : '');
        tab.innerHTML = `${w.label}<span class="order-dot"></span>`;
        tab.addEventListener('click', () => { activeWeekIdx = i; renderAll(); });
        tabsEl.appendChild(tab);
      }
    }

    function calcWeekTotal() {
      const vegs = getVegetables();
      const q = qty[weeks[activeWeekIdx].key] || {};
      return vegs.reduce((sum, v) => sum + (q[v.id] || 0) * v.price, 0);
    }

    function renderOrderBar() {
      const total = calcWeekTotal();
      document.getElementById('orderTotal').innerHTML =
        `${formatPrice(total)} <span>für ${weeks[activeWeekIdx].label}</span>`;
      const hasAny = Object.values(qty[weeks[activeWeekIdx].key] || {}).some(v => v > 0);
      document.getElementById('orderBtn').disabled = !hasAny;
    }

    function renderVegGrid() {
      const vegs = getVegetables();
      const grid = document.getElementById('vegGrid');
      const weekKey = weeks[activeWeekIdx].key;
      if (!qty[weekKey]) qty[weekKey] = {};

      grid.innerHTML = '';
      if (vegs.length === 0) {
        grid.innerHTML = '<div class="empty-state">Kein Gemüse verfügbar.</div>';
        return;
      }

      for (const veg of vegs) {
        const count = qty[weekKey][veg.id] || 0;
        const card = document.createElement('div');
        card.className = 'veg-card' + (count > 0 ? ' selected' : '');
        card.dataset.id = veg.id;
        card.innerHTML = `
          <div class="veg-name">${veg.name}</div>
          <div class="veg-price">${formatPrice(veg.price)} / Stk.</div>
          <div class="qty-control">
            <button class="qty-btn minus">−</button>
            <span class="qty-value">${count}</span>
            <button class="qty-btn plus">+</button>
          </div>
        `;
        card.querySelector('.minus').addEventListener('click', () => changeQty(weekKey, veg.id, -1));
        card.querySelector('.plus').addEventListener('click', () => changeQty(weekKey, veg.id, 1));
        grid.appendChild(card);
      }
    }

    function changeQty(weekKey, vegId, delta) {
      if (!qty[weekKey]) qty[weekKey] = {};
      qty[weekKey][vegId] = Math.max(0, (qty[weekKey][vegId] || 0) + delta);
      // Update DOM directly for performance
      const card = document.querySelector(`.veg-card[data-id="${vegId}"]`);
      if (card) {
        const count = qty[weekKey][vegId];
        card.querySelector('.qty-value').textContent = count;
        card.classList.toggle('selected', count > 0);
      }
      renderOrderBar();
    }

    function renderAll() {
      renderWeekTabs();
      renderVegGrid();
      renderOrderBar();
      document.getElementById('successMsg').classList.remove('show');
    }

    document.getElementById('orderBtn').addEventListener('click', () => {
      const weekKey = weeks[activeWeekIdx].key;
      const vegOrders = Object.entries(qty[weekKey] || {}).map(([vegId, quantity]) => ({ vegId, quantity }));
      saveOrderForUserWeek(session.id, weekKey, vegOrders);
      const msg = document.getElementById('successMsg');
      msg.classList.add('show');
      setTimeout(() => msg.classList.remove('show'), 3000);
      renderWeekTabs();
    });

    loadSavedOrders();
    renderAll();
  </script>
</body>
</html>
